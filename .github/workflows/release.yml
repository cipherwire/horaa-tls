name: Release and Publish

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Explicit tag to build and publish (e.g. v0.3.0)"
        required: false
        default: ""

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please (Automated Versioning & Changelog)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      pull-requests: write
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please Action
        id: release
        uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        with:
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-verify:
    name: Build Distributions & Validate Release Artifacts
    needs: [release-please]
    if: |
      always() &&
      (
        needs.release-please.outputs.releases_created == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.resolve-tag.outputs.tag }}
    steps:
      - name: Determine Target Release Tag
        id: resolve-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          elif [ -n "${{ needs.release-please.outputs.tag_name }}" ]; then
            TAG="${{ needs.release-please.outputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            echo "Error: Unable to determine release tag."
            exit 1
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target release tag: $TAG"

      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.resolve-tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"

      - name: Verify Tag Alignment with Package Version
        run: |
          python -c "
          import tomllib, sys
          expected_tag = '${{ steps.resolve-tag.outputs.tag }}'
          expected_ver = expected_tag.lstrip('v')
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          actual_ver = data['project']['version']
          print(f'Checking tag {expected_tag}: pyproject.toml has version {actual_ver}')
          if actual_ver != expected_ver:
              sys.exit(f'FATAL: Tag version ({expected_ver}) does not match pyproject.toml ({actual_ver})')
          "

      - name: Install Packaging Tools
        run: python -m pip install --upgrade build twine

      - name: Build Source Distribution and Wheel
        run: python -m build

      - name: Check Artifact Metadata with Twine
        run: python -m twine check --strict dist/*

      - name: Verify Distribution Cleanliness
        run: |
          python -c "
          import zipfile, glob, sys
          wheels = glob.glob('dist/*.whl')
          if not wheels:
              sys.exit('No wheel found in dist/')
          with zipfile.ZipFile(wheels[0]) as z:
              for name in z.namelist():
                  print('Artifact member:', name)
                  assert not name.startswith('tests/'), f'Test file found in wheel: {name}'
                  assert not name.startswith('audit_reports/'), f'Audit file found in wheel: {name}'
          "

      - name: Test Isolated Wheel Installation & Import
        run: |
          python -m venv test_env
          ./test_env/bin/pip install --no-index dist/*.whl
          ./test_env/bin/python -c "
          import horaa_tls
          from horaa_tls import Session, ClientProfile, Response, BackendError, Protocol
          print('Import horaa_tls SUCCESS, version:', horaa_tls.__version__)
          s = Session(profile=ClientProfile.CHROME_120)
          assert s.profile == 'chrome_120'
          assert s.force_http1 is False
          assert s.timeout_seconds == 30
          print('Isolated installation smoke test PASSED!')
          "

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-dist
          path: dist/*
          retention-days: 7
          if-no-files-found: error

      - name: Attach Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.resolve-tag.outputs.tag }}"
          echo "Attaching built assets to GitHub Release: $TAG"
          gh release upload "$TAG" dist/* --clobber || echo "Notice: release upload skipped or release $TAG not created yet." 

  publish-pypi:
    name: Publish to PyPI (OIDC Trusted Publishing)
    needs: [build-and-verify]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/horaa-tls
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: write  # Required to attach artifacts to GitHub Release
    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist

      - name: Prepare PyPI Packages Directory
        run: |
          mkdir -p pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/ 2>/dev/null || true

      - name: Publish Distribution to PyPI
        uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: pypi-dist/
          print-hash: true
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true

      - name: Attach Artifacts to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-and-verify.outputs.release_tag }}"
          echo "Attaching artifacts to GitHub Release: $TAG"
          gh release upload "$TAG" dist/* --clobber || echo "Notice: gh release upload skipped or release not found."
